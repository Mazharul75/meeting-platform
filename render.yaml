services:
  - type: web
    name: meeting-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: prod
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_BASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: recordings
      - key: SENTRY_DSN
        sync: false
