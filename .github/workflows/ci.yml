name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app scripts
      - run: bandit -q -r app scripts -c pyproject.toml
      - run: pip-audit -r requirements.txt
      - run: pytest tests/unit tests/integration -q
      - run: node --test --test-force-exit tests/js/*.mjs
      - name: Browser end-to-end tests
        run: |
          pip install playwright
          playwright install --with-deps chromium
          pytest tests/e2e -q -p no:cacheprovider
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
