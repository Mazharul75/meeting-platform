{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Log in{% endblock %}
{% block bare %}
<div class="auth-shell">
  <div class="card auth-card ticks">
    <div class="brand"><svg class="icon brand-mark"><use href="#i-logo"/></svg>CSoft&nbsp;<span class="hi">Meetings</span></div>
    <p class="tagline">Private meeting platform for CSoft staff.</p>
    {% if error %}<div class="alert alert-danger text-start" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="email"><svg class="icon"><use href="#i-user"/></svg>Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="username" required autofocus maxlength="254">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password"><svg class="icon"><use href="#i-key"/></svg>Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required maxlength="500">
      </div>
      <button class="btn btn-primary ticks w-100" type="submit">Sign in<svg class="icon icon-end"><use href="#i-arrow"/></svg></button>
    </form>
    <p class="auth-foot">Invite-only — accounts are created by an administrator.</p>
  </div>
</div>
{% endblock %}
